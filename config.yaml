# Tham số thử nghiệm. Đổi ở đây để đánh giá các cấu hình khác nhau.
# Bí mật (API key) KHÔNG đặt ở đây mà trong file .env.

chunking:
  chunk_size: 800        # số ký tự tối đa mỗi chunk
  chunk_overlap: 150     # số ký tự lặp lại giữa hai chunk liền nhau

retrieval:
  top_k: 5               # số chunk ChromaDB trả về cho mỗi lần tìm
  max_distance: 0.65     # khoảng cách cosine tối đa; chunk xa hơn bị coi là không liên quan

agent:
  max_steps: 6           # số vòng gọi model tối đa trong một lượt hỏi
